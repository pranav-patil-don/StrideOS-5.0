async function saveNewGoal() {
  const title = document.getElementById('goal-title').value.trim() || 'Custom Goal';
  const type = document.getElementById('goal-type').value;
  const target = Number(document.getElementById('goal-target').value) || 50;
  const period = document.getElementById('goal-period').value;

  const goal = {
    id: 'goal_' + Date.now(),
    title,
    type,
    target,
    current: 0,
    unit: type === 'distance' ? Format.distUnit() : 'sessions',
    period,
    createdAt: new Date().toISOString()
  };

  AppState.goals.push(goal);
  await DB.put('goals', goal);
  closeModal();
  showToast('Goal created!');
  renderGoalsScreen();
}

async function deleteGoal(id) {
  if (confirm('Delete this goal?')) {
    AppState.goals = AppState.goals.filter(g => g.id !== id);
    await DB.delete('goals', id);
    showToast('Goal removed');
    renderGoalsScreen();
  }
}

    <div class="modal-box" style="text-align:center;">
      <div class="modal-header">

      </div>

        <canvas id="share-card-canvas" width="600" height="600" style="width:100%;max-width:340px;height:auto;border-radius:12px;display:block;margin:0 auto;background:#08090b;"></canvas>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" style="flex:2;" onclick="downloadShareCard()">Download PNG</button>

    </div>
  `;
  modal.classList.add('active');

  // Draw Card to Canvas
  setTimeout(() => {

function drawShareCard(act) {
  const canvas = document.getElementById('share-card-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Background
  ctx.fillStyle = '#08090b';
  ctx.fillRect(0, 0, w, h);

  // Border frame
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 4;
  ctx.strokeRect(16, 16, w - 32, h - 32);

  // Brand Header
  ctx.fillStyle = '#b8ff3d';
  ctx.font = '900 24px -apple-system, sans-serif';
  ctx.fillText('STRIDEOS 3.0', 40, 60);

  ctx.fillStyle = '#68707d';
  ctx.font = '700 12px monospace';
  ctx.fillText('PRIVATE · LOCAL · OFFLINE', 40, 82);

  // Sport & Date
  const emoji = act.type === 'cycling' ? '🚴 RIDE' : act.type === 'swimming' ? '🏊 SWIM' : '🏃 RUN';
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 18px -apple-system, sans-serif';
  ctx.fillText(`${emoji} · ${Format.date(act.startTime).toUpperCase()}`, 40, 130);

  // Big Distance
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 68px monospace';
  ctx.fillText(Format.distance(act.distance, false), 40, 205);

  ctx.fillStyle = '#b8ff3d';
  ctx.font = '700 22px -apple-system, sans-serif';
  ctx.fillText(Format.distUnit().toUpperCase(), 40 + ctx.measureText(Format.distance(act.distance, false)).width + 12, 175);

  // 3-Columns: Duration, Pace, Elevation
  ctx.fillStyle = '#9ba3af';
  ctx.font = '700 13px -apple-system, sans-serif';
  ctx.fillText('DURATION', 40, 260);
  ctx.fillText('AVG PACE', 230, 260);
  ctx.fillText('ELEVATION', 420, 260);

  ctx.fillStyle = '#f5f7fa';
  ctx.font = '800 26px monospace';
  ctx.fillText(Format.duration(act.duration), 40, 295);
  ctx.fillText(Format.pace(act.averagePace, act.type), 230, 295);
  ctx.fillText(Format.elevation(act.elevationGain), 420, 295);

  // Draw Route Polyline if coordinates exist
  if (act.routePoints && act.routePoints.length >= 2) {
    const pts = act.routePoints;
    let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
    pts.forEach(p => {
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon;
      if (p.lon > maxLon) maxLon = p.lon;
    });

    const boxX = 40;
    const boxY = 340;
    const boxW = w - 80;
    const boxH = 200;

    const latSpan = (maxLat - minLat) || 0.0001;
    const lonSpan = (maxLon - minLon) || 0.0001;
    const scale = Math.min(boxW / lonSpan, boxH / latSpan);
    const offX = boxX + (boxW - lonSpan * scale) / 2;
    const offY = boxY + (boxH - latSpan * scale) / 2;

    ctx.strokeStyle = '#b8ff3d';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();

    pts.forEach((p, i) => {
      const x = offX + (p.lon - minLon) * scale;
      const y = boxY + boxH - ((p.lat - minLat) * scale);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  } else {
    ctx.fillStyle = '#68707d';
    ctx.font = '600 14px -apple-system, sans-serif';
    ctx.fillText('“Train with clarity. Move with purpose.”', 40, 440);
  }

  // Footer Tagline
  ctx.fillStyle = '#68707d';
  ctx.font = '600 12px monospace';
  ctx.fillText('STRIDEOS.LOCAL · NO CLOUD TRACKING', 40, 560);
}

function downloadShareCard() {

  const link = document.createElement('a');
  link.download = `StrideOS-Activity-${Date.now()}.png`;

function exportGPX(actId) {
  const act = AppState.activities.find(a => a.id === actId);
  if (!act || !act.routePoints || act.routePoints.length < 2) {
    showToast('No GPS track available to export for this activity');
    return;
  }

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="StrideOS 3.0 - Private Personal Training OS" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>${act.type.toUpperCase()} - StrideOS</name>
    <time>${act.startTime}</time>
  </metadata>
  <trk>
    <name>${act.type.toUpperCase()}</name>
    <type>${act.type.toUpperCase()}</type>
    <trkseg>
      ${act.routePoints.map(p => `
      <trkpt lat="${p.lat}" lon="${p.lon}">
        <ele>${p.alt || 0}</ele>
        <time>${new Date(p.time).toISOString()}</time>
      </trkpt>`).join('')}
    </trkseg>
  </trk>
</gpx>`;

  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `StrideOS_${act.type}_${act.id}.gpx`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('GPX exported!');
}

function exportJSONBackup() {
  const data = {
    strideOSVersion: '3.0.0',
    exportDate: new Date().toISOString(),
    settings: AppState.settings,
    activities: AppState.activities,
    goals: AppState.goals,
    prs: AppState.prs
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `StrideOS_Backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Full backup downloaded!');
}

async function importJSONBackup(input) {
  const file = input.files?.[0];
  if (!file) return;

  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (!data.activities && !data.settings) {
      alert('Invalid StrideOS backup file format.');
      return;
    }

    if (confirm(`Import ${data.activities ? data.activities.length : 0} activities? Existing activities will be merged.`)) {
      if (data.activities && Array.isArray(data.activities)) {
        for (const act of data.activities) {
          await DB.put('activities', act);
        }
      }
      if (data.goals && Array.isArray(data.goals)) {
        for (const g of data.goals) {
          await DB.put('goals', g);
        }
      }
      if (data.prs) {
        await DB.put('personalRecords', { id: 'user_prs', records: data.prs });
      }

      await loadAppData();
      showToast('Backup successfully imported!');
      Router.navigate('home');
    }
  } catch (err) {
    alert('Error importing JSON: ' + err.message);
  }
}

function exportCSV() {
  const acts = AppState.activities;
  if (!acts.length) {
    showToast('No activities to export');
    return;
  }

  const headers = ['ID', 'Date', 'Sport', 'Distance_km', 'Duration_sec', 'AvgPace_sec_km', 'Elevation_m', 'Calories', 'RPE', 'Feeling', 'Notes'];
  const rows = acts.map(a => [
    a.id,
    a.startTime,
    a.type,
    a.distance,
    a.duration,
    a.averagePace,
    a.elevationGain,
    a.calories,
    a.rpe,
    a.feeling,
    `"${(a.notes || '').replace(/"/g, '""')}"`
  ]);

  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `StrideOS_Activities_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Activities CSV exported!');
}

async function deleteActivity(id) {
  if (confirm('Permanently delete this activity?')) {
    await DB.delete('activities', id);
    AppState.activities = AppState.activities.filter(a => a.id !== id);
    showToast('Activity deleted');
    Router.navigate('activities');
  }
}

async function confirmClearAllData() {
  if (confirm('This permanently removes ALL StrideOS activity data from this device. Are you completely sure?')) {
    await DB.clear('activities');
    await DB.clear('goals');
    await DB.clear('personalRecords');
    AppState.activities = [];
    AppState.goals = [];
    AppState.prs = {};
    showToast('All local data removed');
    Router.navigate('home');
  }
}

          <label style="display:flex;align-items:center;gap:12px;background:var(--surface-2);padding:12px 16px;border-radius:var(--radius-sm);cursor:pointer;">
            <input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--primary);">
            <span style="font-weight:700;">🏊 Swimming</span>
          </label>
        </div>
        <button class="btn btn-primary" style="width:100%;height:48px;" onclick="renderOnboardingStep(3)">Continue</button>
      </div>
    `;
  } else if (step === 3) {
    c.innerHTML = `
      <div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:var(--primary);text-transform:uppercase;">STEP 3 OF 4</div>
        <h2 style="font-size:22px;font-weight:900;margin:4px 0 16px;">What's your primary goal?</h2>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px;">
          <button class="btn btn-secondary" style="justify-content:flex-start;padding:12px;" onclick="onboardingData.goal='Build endurance'; renderOnboardingStep(4);">🎯 Build Endurance</button>
          <button class="btn btn-secondary" style="justify-content:flex-start;padding:12px;" onclick="onboardingData.goal='Get faster'; renderOnboardingStep(4);">⚡ Get Faster (PRs)</button>
          <button class="btn btn-secondary" style="justify-content:flex-start;padding:12px;" onclick="onboardingData.goal='Stay consistent'; renderOnboardingStep(4);">🔥 Stay Consistent</button>
          <button class="btn btn-secondary" style="justify-content:flex-start;padding:12px;" onclick="onboardingData.goal='Race prep'; renderOnboardingStep(4);">🏁 Race Preparation</button>
        </div>
      </div>
    `;
  } else if (step === 4) {
    c.innerHTML = `
      <div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:var(--primary);text-transform:uppercase;">STEP 4 OF 4</div>
        <h2 style="font-size:22px;font-weight:900;margin:4px 0 6px;">Weekly target</h2>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;">Configure your weekly volume baseline.</div>
        <div style="background:var(--surface-2);padding:20px;border-radius:var(--radius-md);text-align:center;margin-bottom:24px;">
          <div id="ob-target-val" style="font-size:42px;font-weight:900;font-family:var(--font-mono);color:var(--primary);">25 km</div>
          <input type="range" min="10" max="80" step="5" value="25" style="width:100%;margin-top:12px;accent-color:var(--primary);" oninput="onboardingData.weeklyTarget = Number(this.value); document.getElementById('ob-target-val').textContent = this.value + ' km';">
        </div>
        <button class="btn btn-primary" style="width:100%;height:52px;font-size:16px;" onclick="finishOnboarding()">START TRAINING</button>
      </div>
    `;
  }
}

async function finishOnboarding() {
  AppState.settings.weeklyGoal = onboardingData.weeklyTarget || 25;
  AppState.settings.goalFocus = onboardingData.goal;
  AppState.settings.onboardingComplete = true;
  await DB.put('settings', AppState.settings);
  document.getElementById('onboarding-overlay').classList.remove('active');
  showToast('Welcome to StrideOS 3.0!');
  Router.navigate('home');
}

// ==========================================
// Initialization Lifecycle
// ==========================================
async function loadAppData() {
  try {
    const savedSettings = await DB.get('settings', 'user_settings');
    if (savedSettings) AppState.settings = { ...AppState.settings, ...savedSettings };

    const acts = await DB.getAll('activities');
    AppState.activities = acts.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));

    const goals = await DB.getAll('goals');
    AppState.goals = goals;

    const prDoc = await DB.get('personalRecords', 'user_prs');
    if (prDoc && prDoc.records) AppState.prs = prDoc.records;

    // Apply theme
    if (AppState.settings.theme) {
      document.body.setAttribute('data-theme', AppState.settings.theme);
    }
  } catch (err) {
    console.error('Error loading StrideOS data:', err);
  }
}

async function initStrideOS() {
  try {
    await DB.init();
    await loadAppData();
    checkOnboarding();
    Router.navigate('home');
  } catch (err) {
    console.error('Fatal initialization error:', err);
  }
}

// Start application when DOM is ready
window.addEventListener('DOMContentLoaded', () => {
  initStrideOS();
});
</script>
</body>
</html>
